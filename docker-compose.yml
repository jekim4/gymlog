services:
  gymlog:
    build: ./gym-log
    expose:
      - "3000"
    environment:
      - DATABASE_URL=file:/data/gymlog.db
      - NODE_ENV=production
    volumes:
      - gymlog-data:/data
    restart: unless-stopped

  portfolio:
    build: ./portfolio
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

volumes:
  gymlog-data:
  caddy-data:
  caddy-config:
